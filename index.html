    <style>
        body {
            font-family: 'Inter', sans-serif;

        /* Background pattern for cover screen */
        .pattern-bg {
            background-color: #0d1b3e;

            background-size: 24px 24px;
            background-position: -19px -19px;

        /* TTS Cell Inputs */
        .tts-cell {
            width: 38px;
            height: 38px;
            font-size: 18px;
            font-weight: 700;
            text-transform: uppercase;
            text-align: center;
            border: 1px solid #94a3b8;
            border-radius: 4px;
            position: relative;
            transition: all 0.15s ease;
            background-color: #ffffff;
            color: #0f172a;
        }

        .tts-cell:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.3);
        }

        .tts-cell.active-cell {
            background-color: #fef08a !important; /* Yellow active cell */
            border-color: #eab308 !important;
        }

        .tts-cell.active-word {
            background-color: #e0f2fe; /* Light blue word highlight */
        }

        .tts-cell.correct-cell {
            background-color: #dcfce7 !important;
            border-color: #22c55e !important;
            color: #15803d !important;
        }

        .tts-cell.wrong-cell {
            background-color: #fee2e2 !important;
            border-color: #ef4444 !important;
            color: #b91c1c !important;
            animation: shake 0.3s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-3px); }
            40%, 80% { transform: translateX(3px); }
        }

        /* Responsive TTS Container Scrollbar */
        .tts-scroll-container::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        .tts-scroll-container::-webkit-scrollbar-track {

    </style>

    <script>
        // All 20 Questions Data
        const WORDS_DATA = [
            // Mendatar (Across)
            { id: 1, num: 1, dir: 'across', r: 5, c: 7, answer: 'CACAH', clue: 'Jenis bilangan yang dipelajari pada materi ini sampai 100.000.' },
            { id: 2, num: 2, dir: 'across', r: 6, c: 0, answer: 'MEMBANDINGKAN', clue: 'Kegiatan menentukan bilangan yang lebih besar, lebih kecil, atau sama.' },
            { id: 3, num: 3, dir: 'across', r: 15, c: 1, answer: 'MENGURUTKAN', clue: 'Menyusun bilangan dari yang terkecil atau terbesar disebut ....' },
            { id: 4, num: 4, dir: 'across', r: 4, c: 0, answer: 'PULUHRIBUAN', clue: 'Nilai tempat tertinggi pada bilangan sampai 100.000.' },
            { id: 5, num: 5, dir: 'across', r: 8, c: 8, answer: '84800', clue: 'Harga robot biru pada contoh soal.' },
            { id: 6, num: 6, dir: 'across', r: 10, c: 8, answer: '85750', clue: 'Harga robot hijau pada contoh soal.' },
            { id: 7, num: 7, dir: 'across', r: 12, c: 1, answer: '38400', clue: 'Harga boneka cokelat pada contoh soal.' },
            { id: 8, num: 8, dir: 'across', r: 8, c: 1, answer: '38800', clue: 'Harga boneka biru pada contoh soal.' },
            { id: 9, num: 9, dir: 'across', r: 10, c: 1, answer: '56560', clue: 'Harga dakon yang paling murah pada contoh.' },
            { id: 10, num: 10, dir: 'across', r: 15, c: 12, answer: '75360', clue: 'Harga dakon yang paling mahal pada contoh.' },

            // Menurun (Down)
            { id: 11, num: 11, dir: 'down', r: 1, c: 8, answer: 'RIBUAN', clue: 'Nilai tempat setelah puluh ribuan.' },
            { id: 12, num: 12, dir: 'down', r: 1, c: 11, answer: 'RATUSAN', clue: 'Nilai tempat setelah ribuan.' },
            { id: 13, num: 13, dir: 'down', r: 6, c: 13, answer: 'PULUHAN', clue: 'Nilai tempat setelah ratusan.' },
            { id: 14, num: 14, dir: 'down', r: 8, c: 14, answer: 'SATUAN', clue: 'Nilai tempat paling kanan pada suatu bilangan.' },
            { id: 15, num: 15, dir: 'down', r: 1, c: 15, answer: 'LEBIHDARI', clue: 'Tanda perbandingan yang berarti lebih besar dari.' },
            { id: 16, num: 16, dir: 'down', r: 1, c: 17, answer: 'KURANGDARI', clue: 'Tanda perbandingan yang berarti lebih kecil dari.' },
            { id: 17, num: 17, dir: 'down', r: 1, c: 19, answer: 'SAMADENGAN', clue: 'Tanda yang digunakan jika dua bilangan mempunyai nilai yang sama.' },
            { id: 18, num: 18, dir: 'across', r: 0, c: 10, answer: '76675', clue: 'Bilangan yang lebih besar pada pasangan 76.675 dan 67.765.' },
            { id: 19, num: 19, dir: 'down', r: 11, c: 17, answer: '86567', clue: 'Bilangan yang lebih kecil pada pasangan 86.567 dan 86.576.' },
            { id: 20, num: 20, dir: 'down', r: 8, c: 5, answer: '13234', clue: 'Bilangan yang nilainya sama dengan 13.234.' }
        ];

        // State variables
        let activeWordId = 1;
        let activeCellCoords = { r: 5, c: 7 };
        let gridMatrix = {}; // key: "r_c", val: { char, numberLabel, words: [] }
        let studentData = { name: '', class: '5' };

        function initGridEngine() {
            gridMatrix = {};

            // Calculate grid bounds and map cells
            WORDS_DATA.forEach(w => {
                const len = w.answer.length;
                for (let i = 0; i < len; i++) {
                    const r = w.dir === 'across' ? w.r : w.r + i;
                    const c = w.dir === 'across' ? w.c + i : w.c;
                    const key = `${r}_${c}`;

                    if (!gridMatrix[key]) {
                        gridMatrix[key] = {
                            r: r,
                            c: c,
                            char: w.answer[i],
                            numLabel: null,
                            words: []
                        };
                    }
                    gridMatrix[key].words.push(w.id);

                    // Assign clue number on start cell
                    if (i === 0) {
                        gridMatrix[key].numLabel = w.num;
                    }
                }
            });

            renderGridBoard();
        }

        function renderGridBoard() {
            const boardContainer = document.getElementById('grid-board');
            boardContainer.innerHTML = '';

            // Find max rows and cols to size container
            let maxR = 0, maxC = 0;
            Object.values(gridMatrix).forEach(cell => {
                if (cell.r > maxR) maxR = cell.r;
                if (cell.c > maxC) maxC = cell.c;
            });

            const CELL_SIZE = 42; // px + spacing
            boardContainer.style.width = `${(maxC + 1) * CELL_SIZE + 24}px`;
            boardContainer.style.height = `${(maxR + 1) * CELL_SIZE + 24}px`;

            Object.values(gridMatrix).forEach(cell => {
                const key = `${cell.r}_${cell.c}`;
                const cellEl = document.createElement('div');
                cellEl.className = 'absolute flex items-center justify-center';
                cellEl.style.left = `${cell.c * CELL_SIZE + 12}px`;
                cellEl.style.top = `${cell.r * CELL_SIZE + 12}px`;
                cellEl.style.width = '38px';
                cellEl.style.height = '38px';

                // Number label in corner
                if (cell.numLabel) {
                    const numSpan = document.createElement('span');
                    numSpan.className = 'absolute top-0.5 left-1 text-[9px] font-black text-slate-600 pointer-events-none z-10';
                    numSpan.innerText = cell.numLabel;
                    cellEl.appendChild(numSpan);
                }

                // Input element
                const input = document.createElement('input');
                input.type = 'text';
                input.maxLength = 1;
                input.id = `input_${key}`;
                input.className = 'tts-cell';
                input.dataset.r = cell.r;
                input.dataset.c = cell.c;

                // Event Listeners
                input.addEventListener('focus', () => handleCellFocus(cell.r, cell.c));
                input.addEventListener('input', (e) => handleCellInput(e, cell.r, cell.c));
                input.addEventListener('keydown', (e) => handleCellKeyDown(e, cell.r, cell.c));

                cellEl.appendChild(input);
                boardContainer.appendChild(cellEl);
            });

            // Set default initial selection
            selectWord(1);
        }

        function handleCellFocus(r, c) {
            activeCellCoords = { r, c };
            const key = `${r}_${c}`;
            const cellData = gridMatrix[key];

            if (cellData && cellData.words.length > 0) {
                // If active word is not part of this cell, switch to first word in cell
                if (!cellData.words.includes(activeWordId)) {
                    activeWordId = cellData.words[0];
                }
            }
            updateGridHighlights();
            updateClueDisplay();
        }

        function selectWord(wordId) {
            activeWordId = wordId;
            const word = WORDS_DATA.find(w => w.id === wordId);
            if (word) {
                activeCellCoords = { r: word.r, c: word.c };
                const firstInput = document.getElementById(`input_${word.r}_${word.c}`);
                if (firstInput) firstInput.focus();
            }
            updateGridHighlights();
            updateClueDisplay();
        }

        function updateGridHighlights() {
            const activeWord = WORDS_DATA.find(w => w.id === activeWordId);
            if (!activeWord) return;

            // Clear all highlights
            document.querySelectorAll('.tts-cell').forEach(el => {
                el.classList.remove('active-word', 'active-cell');
            });

            // Highlight all cells in active word
            const len = activeWord.answer.length;
            for (let i = 0; i < len; i++) {
                const r = activeWord.dir === 'across' ? activeWord.r : activeWord.r + i;
                const c = activeWord.dir === 'across' ? activeWord.c + i : activeWord.c;
                const input = document.getElementById(`input_${r}_${c}`);
                if (input) {
                    input.classList.add('active-word');
                }
            }

            // Highlight exact focused cell
            const currentInput = document.getElementById(`input_${activeCellCoords.r}_${activeCellCoords.c}`);
            if (currentInput) {
                currentInput.classList.add('active-cell');
            }
        }

        function updateClueDisplay() {
            const word = WORDS_DATA.find(w => w.id === activeWordId);
            if (!word) return;

            const badgeEl = document.getElementById('clue-direction-badge');
            const textEl = document.getElementById('clue-text');

            const dirText = word.dir === 'across' ? 'MENDATAR' : 'MENURUN';
            badgeEl.innerText = `➔ ${word.num}. ${dirText}`;
            textEl.innerText = word.clue;
        }

        function handleCellInput(e, r, c) {
            const val = e.target.value.toUpperCase();
            e.target.value = val;

            if (val) {
                // Remove wrong state if typed over
                e.target.classList.remove('wrong-cell');

                // Auto-advance to next cell in active word direction
                const word = WORDS_DATA.find(w => w.id === activeWordId);
                if (word) {
                    let nextR = r;
                    let nextC = c;
                    if (word.dir === 'across') nextC++;
                    else nextR++;

                    const nextInput = document.getElementById(`input_${nextR}_${nextC}`);
                    if (nextInput) {
                        nextInput.focus();
                    }
                }
            }
        }

        function handleCellKeyDown(e, r, c) {
            const word = WORDS_DATA.find(w => w.id === activeWordId);
            if (!word) return;

            if (e.key === 'Backspace') {
                const input = document.getElementById(`input_${r}_${c}`);
                if (input && input.value === '') {
                    // Move to previous cell
                    let prevR = r;
                    let prevC = c;
                    if (word.dir === 'across') prevC--;
                    else prevR--;

                    const prevInput = document.getElementById(`input_${prevR}_${prevC}`);
                    if (prevInput) {
                        prevInput.focus();
                    }
                }
            } else if (e.key === 'ArrowRight') {
                const nextInput = document.getElementById(`input_${r}_${c + 1}`);
                if (nextInput) nextInput.focus();
            } else if (e.key === 'ArrowLeft') {
                const prevInput = document.getElementById(`input_${r}_${c - 1}`);
                if (prevInput) prevInput.focus();
            } else if (e.key === 'ArrowDown') {
                const nextInput = document.getElementById(`input_${r + 1}_${c}`);
                if (nextInput) nextInput.focus();
            } else if (e.key === 'ArrowUp') {
                const prevInput = document.getElementById(`input_${r - 1}_${c}`);
                if (prevInput) prevInput.focus();
            }
        }

        function checkAnswers() {
            let totalCells = 0;
            let correctCells = 0;
            let hasWrong = false;

            Object.values(gridMatrix).forEach(cell => {
                totalCells++;
                const input = document.getElementById(`input_${cell.r}_${cell.c}`);
                if (input) {
                    const userVal = input.value.trim().toUpperCase();
                    if (userVal === cell.char) {
                        correctCells++;
                        input.classList.remove('wrong-cell');
                        input.classList.add('correct-cell');
                    } else if (userVal !== '') {
                        hasWrong = true;
                        input.classList.remove('correct-cell');
                        input.classList.add('wrong-cell');
                    } else {
                        hasWrong = true;
                        input.classList.remove('correct-cell', 'wrong-cell');
                    }
                }
            });

            // Positive Feedbacks requested by user
            const POSITIVE_FEEDBACKS = [
                "wow kamu hebat sekali",
                "Keren... kamu Pintar Sekali"
            ];

            // Gentle feedback when wrong or incomplete
            const GENTLE_FEEDBACK = "coba lagi yuk";

            if (correctCells === totalCells) {
                // Sound Effect
                playCelebrationSound();

                // Trigger Confetti
                if (typeof confetti === 'function') {
                    confetti({
                        particleCount: 100,
                        spread: 70,
                        origin: { y: 0.6 }
                    });
                }

                const randomPositive = POSITIVE_FEEDBACKS[Math.floor(Math.random() * POSITIVE_FEEDBACKS.length)];
                showModal("🏆 HEBAT!", randomPositive, "🎉");
            } else {
                playTryAgainSound();
                showModal("BELUM TEPAT", GENTLE_FEEDBACK, "💡");
            }
        }

        function confirmReset() {
            if (confirm("Apakah kamu yakin ingin mengulang permainan dari awal?")) {
                Object.values(gridMatrix).forEach(cell => {
                    const input = document.getElementById(`input_${cell.r}_${cell.c}`);
                    if (input) {
                        input.value = '';
                        input.className = 'tts-cell';
                    }
                });
                selectWord(1);
            }
        }

        function playCelebrationSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const notes = [261.63, 329.63, 392.00, 523.25]; // C E G C
                notes.forEach((freq, idx) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.2, ctx.currentTime + idx * 0.12);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.12 + 0.3);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(ctx.currentTime + idx * 0.12);
                    osc.stop(ctx.currentTime + idx * 0.12 + 0.3);
                });
            } catch(e) {}
        }

        function playTryAgainSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(200, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(120, ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            } catch(e) {}
        }

        function goToIdentityScreen() {
            document.getElementById('screen-cover').classList.add('hidden');
            document.getElementById('screen-identity').classList.remove('hidden');
        }

        function startGame(e) {
            e.preventDefault();
            const nama = document.getElementById('input-nama').value.trim();
            const kelas = document.getElementById('input-kelas').value.trim();

            if (nama) {
                studentData.name = nama;
                studentData.class = kelas || '5';

                document.getElementById('display-nama').innerText = studentData.name;
                document.getElementById('display-kelas').innerText = studentData.class;

                document.getElementById('screen-identity').classList.add('hidden');
                document.getElementById('screen-game').classList.remove('hidden');

                initGridEngine();
            }
        }

        function showModal(title, msg, icon) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = msg;
            document.getElementById('modal-icon').innerText = icon || '🌟';
            document.getElementById('modal-feedback').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal-feedback').classList.add('hidden');
        }

        function toggleFullscreen() {
            const doc = document.documentElement;
            if (!document.fullscreenElement && !document.mozFullScreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
                if (doc.requestFullscreen) {
                    doc.requestFullscreen().catch(err => { console.log(err); });
                } else if (doc.msRequestFullscreen) {
                    doc.msRequestFullscreen();
                } else if (doc.mozRequestFullScreen) {
                    doc.mozRequestFullScreen();
                } else if (doc.webkitRequestFullscreen) {
                    doc.webkitRequestFullscreen(Element.ALLOW_KEYBOARD_INPUT);
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                } else if (document.mozCancelFullScreen) {
                    document.mozCancelFullScreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        }
    </script>
</body>
</html>
